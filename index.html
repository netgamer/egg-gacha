<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0616" />
    <meta
      name="description"
      content="신비한 알을 뽑아 부화시켜 보세요. 8종의 알에서 6파츠 조합 드래곤이 태어나는 미스터리 에그 가챠."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>신비한 알 뽑기 · 드래곤 부화</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%9A%3C/text%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-C6adh7h4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-D0sT8mHm.css">
  </head>
  <body>
    <div id="app">
      <div class="backdrop" aria-hidden="true">
        <div class="aura" id="aura"></div>
        <div class="vignette"></div>
      </div>

      <canvas id="fx" class="fx" aria-hidden="true"></canvas>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">🥚</span>
          <div class="brand-text">
            <h1>신비한 알 뽑기</h1>
            <p>DRAGON HATCH · NFT STYLE</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="soundBtn" class="icon-btn" type="button" aria-label="소리 끄기" aria-pressed="true">
            <span class="ico-on">🔊</span><span class="ico-off">🔇</span>
          </button>
          <button id="dexBtn" class="dex-btn" type="button" aria-haspopup="dialog">
            <span>도감</span>
            <span class="dex-num"><b id="dexCount">0</b><i>/8</i></span>
            <span class="dex-dragons" title="부화한 드래곤">🐲 <b id="dragonCount">0</b></span>
          </button>
        </div>
      </header>

      <main class="stage" id="stage">
        <div class="banner" id="banner" role="status" aria-live="polite">
          <span class="btxt" id="bannerText">행운을 빌어요!</span>
        </div>

        <div class="roulette" id="roulette">
          <div class="track" id="track"></div>
          <div class="center-frame" id="centerFrame" aria-hidden="true">
            <span class="cf-glow"></span>
            <span class="cf-spark cf-spark-l"></span><span class="cf-spark cf-spark-r"></span>
          </div>
          <div class="marker marker-top" aria-hidden="true"></div>
          <div class="marker marker-bottom" aria-hidden="true"></div>
          <button id="hatchCue" class="hatch-cue" type="button" hidden>
            <span class="hc-egg">🥚</span><span class="hc-text">알 깨기!</span><span class="hc-burst">💥</span>
          </button>
        </div>

        <p class="mini-odds" id="miniOdds"></p>
        <div class="results" id="results" aria-live="polite"></div>
      </main>

      <section class="controls">
        <div class="stats">
          <span class="stat"><em id="pullCount">0</em>회 뽑기</span>
          <span class="dot"></span>
          <span class="stat">발견 <em id="foundCount">0</em><i>/8</i></span>
        </div>
        <div class="btns">
          <button id="pull1" class="btn btn-primary" type="button">
            <span class="btn-label">1회 뽑기</span>
            <span class="btn-sub">한 번에 한 알</span>
          </button>
          <button id="pull5" class="btn btn-secondary" type="button">
            <span class="btn-label">5연속 뽑기</span>
            <span class="btn-sub">연속 5회</span>
          </button>
        </div>
        <p class="hint" id="hint">알을 뽑으면 도감에 기록돼요</p>
      </section>

      <!-- egg → dragon hatch stage -->
      <div class="hatch" id="hatch" role="dialog" aria-modal="true" aria-labelledby="hatchTitle" aria-hidden="true">
        <div class="hatch-box">
          <div class="hatch-bar">
            <span class="hatch-step" id="hatchStep"></span>
            <button id="hatchClose" class="icon-btn close" type="button" aria-label="부화 화면 닫기">✕</button>
          </div>

          <div class="hatch-stage" id="hatchStage">
            <div class="egg-wrap" id="eggWrap" role="button" tabindex="0" aria-label="알 부화시키기">
              <div class="egg-glow" aria-hidden="true"></div>
              <img id="hatchEggImg" alt="부화를 기다리는 알" draggable="false" />
              <svg class="egg-cracks" viewBox="0 0 200 240" aria-hidden="true">
                <path class="crack c1" d="M100 18 L86 62 L106 84 L88 122" />
                <path class="crack c2" d="M100 18 L118 58 L98 92 L118 126" />
                <path class="crack c3" d="M60 96 L86 62 L70 40" />
                <path class="crack c4" d="M140 100 L118 58 L138 34" />
              </svg>
              <div class="egg-rays" aria-hidden="true"></div>
            </div>
            <h2 class="hatch-title" id="hatchTitle">알이 흔들리고 있어요…</h2>
            <p class="hatch-sub" id="hatchSub"></p>
            <button id="hatchBtn" class="btn btn-primary hatch-btn" type="button">
              <span class="btn-label">알 깨기!</span><span class="btn-sub">톡톡, 두드려 보세요</span>
            </button>
          </div>

          <div class="reveal-wrap" id="revealWrap" hidden>
            <div id="revealCard"></div>
            <div class="reveal-actions">
              <button id="nextHatch" class="btn btn-secondary" type="button" hidden>
                <span class="btn-label">다음 알 부화</span><span class="btn-sub" id="nextHatchSub"></span>
              </button>
              <button id="revealClose" class="btn btn-primary" type="button">
                <span class="btn-label">확인</span><span class="btn-sub">도감에 저장했어요</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <aside class="sheet" id="dex" role="dialog" aria-modal="true" aria-labelledby="dexTitle" aria-hidden="true">
        <div class="sheet-grab" id="sheetGrab" aria-hidden="true"></div>
        <div class="sheet-head">
          <div>
            <h2 id="dexTitle">도감</h2>
            <p id="dexSummary">발견 0 / 8 · 총 0회</p>
          </div>
          <button id="dexClose" class="icon-btn close" type="button" aria-label="도감 닫기">✕</button>
        </div>

        <div class="dex-tabs" role="tablist">
          <button class="dex-tab is-on" id="tabEggs" role="tab" aria-selected="true" type="button">
            🥚 알 도감 <b id="tabEggCount">0</b>/8
          </button>
          <button class="dex-tab" id="tabDragons" role="tab" aria-selected="false" type="button">
            🐲 드래곤 도감 <b id="tabDragonCount">0</b>
          </button>
        </div>

        <div class="dex-panel" id="eggPanel" role="tabpanel">
          <div class="dex-grid" id="dexGrid"></div>
          <div class="dex-foot">
            <p class="odds" id="odds"></p>
            <button id="resetBtn" class="reset-btn" type="button">기록 초기화</button>
          </div>
        </div>

        <div class="dex-panel" id="dragonPanel" role="tabpanel" hidden>
          <div class="dragon-grid" id="dragonGrid"></div>
          <p class="dragon-empty" id="dragonEmpty">
            아직 부화한 드래곤이 없어요.<br />알을 뽑아 부화시키면 여기에 모여요!
          </p>
        </div>
      </aside>

      <div class="detail" id="detail" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="detail-box" id="detailBox"></div>
      </div>
    </div>
  </body>
</html>
